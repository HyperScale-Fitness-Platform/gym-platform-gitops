apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gym-platform-root-dev
  namespace: argocd
spec:
  project: gym-platform
  source:
    repoURL: https://github.com/HyperScale-Fitness-Platform/gym-platform-gitops.git
    targetRevision: main
    path: services
    directory:
      recurse: true
      include: "{*/*dev.yaml,*dev.yaml,**/application-dev.yaml}"
      exclude: "operations-service/**"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true