apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-db-schema
data:
  schema.sql: |
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

    CREATE TABLE IF NOT EXISTS customer_exercise_plans (
        plan_id VARCHAR(100) PRIMARY KEY,
        customer_id VARCHAR(100) NOT NULL,
        payload JSONB NOT NULL,
        start_date TIMESTAMPTZ,
        end_date TIMESTAMPTZ,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_customer_exercise_plans_customer
        ON customer_exercise_plans (customer_id, start_date DESC);

    CREATE TABLE IF NOT EXISTS customer_nutrition_plans (
        plan_id VARCHAR(100) PRIMARY KEY,
        customer_id VARCHAR(100) NOT NULL,
        payload JSONB NOT NULL,
        start_date TIMESTAMPTZ,
        end_date TIMESTAMPTZ,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_customer_nutrition_plans_customer
        ON customer_nutrition_plans (customer_id, start_date DESC);

    CREATE TABLE IF NOT EXISTS ai_generated_plans (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id VARCHAR(100) NOT NULL,
        plan_type VARCHAR(50) NOT NULL,
        content JSONB NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_ai_generated_plans_user
        ON ai_generated_plans (user_id, plan_type, created_at DESC);

    CREATE TABLE IF NOT EXISTS chat_sessions (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id VARCHAR(100) NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        last_draft_at TIMESTAMPTZ
    );

    CREATE TABLE IF NOT EXISTS chat_messages (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        session_id UUID NOT NULL REFERENCES chat_sessions(id) ON DELETE CASCADE,
        role VARCHAR(20) NOT NULL,
        content TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- RAG equipment knowledge base. VECTOR(384) matches the
    -- Xenova/all-MiniLM-L6-v2 embedding model used by embedding.service.js.
    CREATE EXTENSION IF NOT EXISTS vector;

    CREATE TABLE IF NOT EXISTS equipment_docs (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        title VARCHAR(255) NOT NULL,
        content TEXT NOT NULL,
        embedding VECTOR(384),
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_equipment_docs_embedding
        ON equipment_docs USING hnsw (embedding vector_cosine_ops);
