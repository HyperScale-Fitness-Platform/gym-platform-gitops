apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command: ['sh', '-c', 'until pg_isready -h ai-postgres -p 5432; do echo waiting for database; sleep 2; done;']
        - name: wait-for-kafka
          image: busybox:1.36.0
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done;']
      containers:
        - name: ai-service
          image: gym-ai-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4006
          envFrom:
            - configMapRef:
                name: ai-service-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ai-svc-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-svc-credentials
                  key: POSTGRES_PASSWORD
            - name: SBG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-svc-credentials
                  key: SBG_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 4006
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4006
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
