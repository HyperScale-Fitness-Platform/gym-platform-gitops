# Syncs the Postgres credentials and the Groq API credentials from AWS
# Secrets Manager.
#
# Prerequisites (seed once, same mechanism as auth/operations/payment):
#   gym/dev/ai-db-credentials -> { username, password }
#   gym/dev/ai-service/llm    -> { GROQ_API_KEY, GROQ_MODEL }
#
# ai-service uses the groq-sdk directly (api.groq.com); GROQ_API_KEY is the
# secret token and GROQ_MODEL is the model id (e.g. openai/gpt-oss-120b).
# Without GROQ_API_KEY the plan-coach calls fail; a resync + pod restart
# picks up a changed value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-svc-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: ClusterSecretStore
  target:
    name: ai-svc-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: gym/dev/ai-db-credentials
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: gym/dev/ai-db-credentials
        property: password
    - secretKey: GROQ_API_KEY
      remoteRef:
        key: gym/dev/ai-service/llm
        property: GROQ_API_KEY
    - secretKey: GROQ_MODEL
      remoteRef:
        key: gym/dev/ai-service/llm
        property: GROQ_MODEL
