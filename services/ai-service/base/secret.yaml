# Syncs the Postgres credentials and the LLM gateway API key from AWS
# Secrets Manager.
#
# Prerequisites (seed once, same mechanism as auth/operations/payment):
#   gym/dev/ai-db-credentials -> { username, password }
#   gym/dev/ai-service/llm    -> { api_key }   (Bearer token for LLM_BASE_URL)
#
# Without api_key the plan-coach LLM calls come back 401 (surfaces in the UI
# as "AI plans coach failed"). It can start as a placeholder and be filled in
# later -- a resync + pod restart picks it up.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-svc-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: ClusterSecretStore
  target:
    name: ai-svc-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: gym/dev/ai-db-credentials
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: gym/dev/ai-db-credentials
        property: password
    - secretKey: SBG_API_KEY
      remoteRef:
        key: gym/dev/ai-service/llm
        property: api_key
