apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  PORT: "8080"
  AWS_REGION: "us-east-1"
  PRODUCT_IMAGES_BUCKET: "gym-platform-product-images"
  AUTH_SERVICE_URL: "http://auth-service:4000"
  OPERATIONS_SERVICE_URL: "http://operations-service:4001"
  # profile-service (formerly "people-service"); real Service name is gym-profile-service
  PEOPLE_SERVICE_URL: "http://gym-profile-service:4002"
  PROGRESS_SERVICE_URL: "http://gym-progress-service:3000"
  SOCIAL_SERVICE_URL: "http://social-service:4003"
  ORDER_SERVICE_URL: "http://gym-order-service:3002"
  PAYMENT_SERVICE_URL: "http://payment-service:4005"
  # /commerce routes to catalog-service; real Service name is gym-catalog-service
  COMMERCE_SERVICE_URL: "http://gym-catalog-service:4005"
  AI_SERVICE_URL: "http://ai-service:4007"
