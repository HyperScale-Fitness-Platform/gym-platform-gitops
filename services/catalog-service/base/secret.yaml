# Pulls the Postgres credentials from AWS Secrets Manager and assembles the
# DATABASE_URL the app (src/config/db.js) reads. Replaces the plaintext
# postgres/postgres Secret that lived in the service repo's k8s/ folder.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-svc-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: ClusterSecretStore
  target:
    name: catalog-svc-credentials
    creationPolicy: Owner
    template:
      data:
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DB: "gym_catalog"
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@gym-catalog-postgres:5432/gym_catalog"
  data:
    - secretKey: username
      remoteRef:
        key: gym/dev/catalog-postgres-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: gym/dev/catalog-postgres-credentials
        property: password
