apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-service
  labels:
    app: operations-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operations-service
  template:
    metadata:
      labels:
        app: operations-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command: ['sh', '-c', 'until pg_isready -h operations-postgres -p 5432; do echo waiting for database; sleep 2; done;']
      containers:
        - name: operations-service
          image: gym-operations-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: operations-service-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: operations-svc-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: operations-svc-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"