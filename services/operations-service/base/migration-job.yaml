apiVersion: batch/v1
kind: Job
metadata:
  name: operations-db-migrate
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: gym-operations-service:latest
          command: ["npm", "run", "migration:run"]
          envFrom:
            - configMapRef:
                name: operations-service-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: operations-svc-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: operations-svc-credentials
                  key: POSTGRES_PASSWORD