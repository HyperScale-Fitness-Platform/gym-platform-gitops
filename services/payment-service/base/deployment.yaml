apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.35.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z payment-postgres 5432; do echo waiting for payment-postgres; sleep 2; done;"]
      containers:
        - name: app
          # Placeholder image; the overlay kustomize images transformer +
          # argocd-image-updater rewrite this to the ECR repo digest/tag.
          image: gym-payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4005
              name: http
          envFrom:
            - configMapRef:
                name: payment-service-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: payment-svc-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-svc-credentials
                  key: POSTGRES_PASSWORD
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-svc-credentials
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-svc-credentials
                  key: STRIPE_WEBHOOK_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
