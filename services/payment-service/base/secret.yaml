# Syncs the Postgres credentials and the Stripe keys from AWS Secrets Manager.
#
# Prerequisites (seed once, same mechanism as auth/operations):
#   gym/dev/payment-postgres-credentials -> { username, password }
#   gym/dev/payment-service/stripe       -> { secret_key, webhook_secret }
#
# The webhook_secret (whsec_...) is only issued by Stripe after the webhook
# endpoint URL is registered in the dashboard, so it can start as a placeholder
# and be filled in later (a resync + pod restart picks it up).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-svc-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: ClusterSecretStore
  target:
    name: payment-svc-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: gym/dev/payment-postgres-credentials
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: gym/dev/payment-postgres-credentials
        property: password
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: gym/dev/payment-service/stripe
        property: secret_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: gym/dev/payment-service/stripe
        property: webhook_secret
