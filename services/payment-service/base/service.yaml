# Service name is "payment-service" (no gym- prefix): both the api-gateway and
# operations-service ConfigMaps already resolve http://payment-service:4005.
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - port: 4005
      targetPort: 4005
      protocol: TCP
      name: http
