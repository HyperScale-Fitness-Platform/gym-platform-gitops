apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-service
  labels:
    app: progress-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: progress-service
  template:
    metadata:
      labels:
        app: progress-service
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36.0
          command: ["sh", "-c", "until nc -z progress-mongo 27017; do echo waiting for mongo; sleep 2; done;"]
        - name: wait-for-kafka
          image: busybox:1.36.0
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done;']
      containers:
        - name: progress-service
          image: gym-progress-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: progress-service-config
          # progress-mongo runs with MONGO_INITDB_ROOT_USERNAME/PASSWORD, so
          # the connection needs credentials (authSource=admin for the root
          # user). Build the full MONGO_URI here via $(VAR) interpolation from
          # the mongo credentials secret -- a ConfigMap can't reference a
          # Secret, and the app only reads MONGO_URI.
          env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: progress-mongo-credentials
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: progress-mongo-credentials
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_URI
              value: "mongodb://$(MONGO_USER):$(MONGO_PASS)@progress-mongo:27017/gym-progress?authSource=admin"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
