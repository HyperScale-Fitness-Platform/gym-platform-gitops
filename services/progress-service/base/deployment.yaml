apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-service
  labels:
    app: progress-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: progress-service
  template:
    metadata:
      labels:
        app: progress-service
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36.0
          command: ["sh", "-c", "until nc -z progress-mongo 27017; do echo waiting for mongo; sleep 2; done;"]
        - name: wait-for-kafka
          image: busybox:1.36.0
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done;']
      containers:
        - name: progress-service
          image: gym-progress-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: progress-service-config
          # MONGO_URI comes from progress-service-config (a full
          # mongodb://... connection string). Do NOT override it here from
          # a secret key that holds only the username -- that produced
          # "MongoParseError: Invalid scheme".
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
