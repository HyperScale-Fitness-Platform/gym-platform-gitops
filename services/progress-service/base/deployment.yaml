apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-service
  labels:
    app: progress-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: progress-service
  template:
    metadata:
      labels:
        app: progress-service
    spec:
      initContainers:
        - name: wait-for-mongo
          image: mongo:7.0
          command: ['sh', '-c', 'until mongosh --host progress-mongo --eval "db.adminCommand(\'ping\')" --quiet; do echo waiting for mongo; sleep 2; done;']
        - name: wait-for-kafka
          image: busybox:1.36.0
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done;']
      containers:
        - name: progress-service
          image: gym-progress-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: progress-service-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: progress-mongo-credentials
                  key: MONGO_INITDB_ROOT_USERNAME
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
