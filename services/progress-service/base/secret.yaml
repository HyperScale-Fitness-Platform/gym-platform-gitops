# Pulls the Mongo root credentials from AWS Secrets Manager and assembles the
# MONGO_URI the app (src/config/database.js) reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: progress-svc-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: ClusterSecretStore
  target:
    name: progress-svc-credentials
    creationPolicy: Owner
    template:
      data:
        MONGO_INITDB_ROOT_USERNAME: "{{ .username }}"
        MONGO_INITDB_ROOT_PASSWORD: "{{ .password }}"
        MONGO_URI: "mongodb://{{ .username }}:{{ .password }}@progress-mongo:27017/gym-progress?authSource=admin"
  data:
    - secretKey: username
      remoteRef:
        key: gym/dev/progress-mongo-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: gym/dev/progress-mongo-credentials
        property: password
