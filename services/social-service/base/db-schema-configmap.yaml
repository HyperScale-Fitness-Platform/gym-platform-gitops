apiVersion: v1
kind: ConfigMap
metadata:
  name: social-db-schema
data:
  schema.sql: |
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

    CREATE TABLE IF NOT EXISTS threads (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL,
        title VARCHAR(255) NOT NULL,
        content TEXT NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS comments (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        thread_id UUID NOT NULL,
        user_id UUID NOT NULL,
        content TEXT NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT fk_comment_thread FOREIGN KEY (thread_id)
            REFERENCES threads(id) ON DELETE CASCADE
    );

    CREATE INDEX IF NOT EXISTS idx_threads_created_at ON threads(created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_threads_user_id ON threads(user_id);
    CREATE INDEX IF NOT EXISTS idx_comments_thread_id_created ON comments(thread_id, created_at ASC);

    CREATE TABLE IF NOT EXISTS customer_profiles (
        user_id UUID PRIMARY KEY,
        full_name VARCHAR(255),
        role VARCHAR(50),
        photo_url VARCHAR(512),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Backfill columns onto an already-created table. social.model.js selects
    -- p.photo_url on every thread/comment query and customerProfile.model.js
    -- upserts (full_name, photo_url) + updated_at; without these the
    -- /community page fails with "column p.photo_url does not exist" (42703).
    ALTER TABLE customer_profiles ADD COLUMN IF NOT EXISTS photo_url VARCHAR(512);
    ALTER TABLE customer_profiles ADD COLUMN IF NOT EXISTS updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP;

    CREATE TABLE IF NOT EXISTS chat_connections (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_one_id UUID,
        user_two_id UUID,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- chatConnection.model.js works on a sorted (user_one_id, user_two_id)
    -- pair and relies on ON CONFLICT DO NOTHING, so it needs those columns
    -- and a unique index on the pair. The original schema had
    -- customer_id/trainer_id NOT NULL, which broke every insert
    -- ("column user_one_id does not exist").
    ALTER TABLE chat_connections ADD COLUMN IF NOT EXISTS user_one_id UUID;
    ALTER TABLE chat_connections ADD COLUMN IF NOT EXISTS user_two_id UUID;
    ALTER TABLE chat_connections DROP COLUMN IF EXISTS customer_id;
    ALTER TABLE chat_connections DROP COLUMN IF EXISTS trainer_id;
    CREATE UNIQUE INDEX IF NOT EXISTS uq_chat_connections_users
        ON chat_connections (user_one_id, user_two_id);

    CREATE TABLE IF NOT EXISTS messages (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        sender_id UUID NOT NULL,
        receiver_id UUID NOT NULL,
        content TEXT NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
