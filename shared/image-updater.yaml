apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: gym-platform-updater
  namespace: argocd
spec:
  writeBackConfig:
    method: git
    gitConfig:
      branch: main
  applicationRefs:
    - namePattern: "auth-service-${ENVIRONMENT}"
      writeBackConfig:
        gitConfig:
          writeBackTarget: "kustomization:./services/auth-service/overlays/${ENVIRONMENT}"
      images:
        - alias: authsvc
          imageName: "${ECR_REGISTRY}/gym-auth-service"
          commonUpdateSettings:
            updateStrategy: newest-build
          manifestTargets:
            kustomize:
              name: "gym-auth-service"
    - namePattern: "api-gateway-${ENVIRONMENT}"
      writeBackConfig:
        gitConfig:
          writeBackTarget: "kustomization:./services/api-gateway/overlays/${ENVIRONMENT}"
      images:
        - alias: apisvc
          imageName: "${ECR_REGISTRY}/gym-api-gateway"
          commonUpdateSettings:
            updateStrategy: newest-build
          manifestTargets:
            kustomize:
              name: "gym-api-gateway"
    - namePattern: "profile-service-${ENVIRONMENT}"
      writeBackConfig:
        gitConfig:
          writeBackTarget: "kustomization:./services/profile-service/overlays/${ENVIRONMENT}"
      images:
        - alias: profilesvc
          imageName: "${ECR_REGISTRY}/gym-profile-service"
          commonUpdateSettings:
            updateStrategy: newest-build
          manifestTargets:
            kustomize:
              name: "gym-profile-service"
    - namePattern: "progress-service-${ENVIRONMENT}"
      writeBackConfig:
        gitConfig:
          writeBackTarget: "kustomization:./services/progress-service/overlays/${ENVIRONMENT}"
      images:
        - alias: progresssvc
          imageName: "${ECR_REGISTRY}/gym-progress-service"
          commonUpdateSettings:
            updateStrategy: newest-build
          manifestTargets:
            kustomize:
              name: "gym-progress-service"
    - namePattern: "catalog-service-${ENVIRONMENT}"
      writeBackConfig:
        gitConfig:
          writeBackTarget: "kustomization:./services/catalog-service/overlays/${ENVIRONMENT}"
      images:
        - alias: catalogsvc
          imageName: "${ECR_REGISTRY}/gym-catalog-service"
          commonUpdateSettings:
            updateStrategy: newest-build
          manifestTargets:
            kustomize:
              name: "gym-catalog-service"
    - namePattern: "order-service-${ENVIRONMENT}"
      writeBackConfig:
        gitConfig:
          writeBackTarget: "kustomization:./services/order-service/overlays/${ENVIRONMENT}"
      images:
        - alias: ordersvc
          imageName: "${ECR_REGISTRY}/gym-order-service"
          commonUpdateSettings:
            updateStrategy: newest-build
          manifestTargets:
            kustomize:
              name: "gym-order-service"
    - namePattern: "payment-service-${ENVIRONMENT}"
      writeBackConfig:
        gitConfig:
          writeBackTarget: "kustomization:./services/payment-service/overlays/${ENVIRONMENT}"
      images:
        - alias: paymentsvc
          imageName: "${ECR_REGISTRY}/gym-payment-service"
          commonUpdateSettings:
            updateStrategy: newest-build
          manifestTargets:
            kustomize:
              name: "gym-payment-service"